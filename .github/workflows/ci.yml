name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

      - name: Build / Compile TypeScript project
        run: npm run build

      - name: Run code quality checks (Lint)
        run: npm run lint

      - name: Run test suite
        run: npm test
